name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck lsof
      - run: npm ci
      - name: ShellCheck
        run: npm run lint
      - name: Tests
        run: npm test

  # The tarball is what users get from npm: install it into a throwaway HOME.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack
        run: |
          npm pack --silent
          tar -tzf agentic-engineering-*.tgz
      - name: Install from the tarball
        run: |
          export HOME="$(mktemp -d)"
          npm exec --yes --package="$(ls "$GITHUB_WORKSPACE"/agentic-engineering-*.tgz)" -- agentic-engineering --global --all
          test -f "$HOME/.claude/skills/spec/SKILL.md"
          test -f "$HOME/.claude/agents/reviewer.md"

  # Oldest and newest supported Node: the CLI must run on both.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: bash tests/test-cli.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
