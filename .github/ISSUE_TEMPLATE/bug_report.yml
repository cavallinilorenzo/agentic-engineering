name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran, the tool (Claude Code, Antigravity) and the skill involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm view agentic-engineering version` or the one you installed.
